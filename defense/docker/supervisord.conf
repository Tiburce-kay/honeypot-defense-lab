; Équivalent des unités systemd de la VM (suricata-ips, defense-modules, ssh,
; ipset-save.timer). L'ordre de démarrage suit start_modules.sh.

[program:sshd]
command=/usr/sbin/sshd -D -e
priority=5
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
redirect_stderr=true

[program:suricata]
command=/usr/bin/suricata -c /etc/suricata/suricata.yaml -q 0
priority=10
startsecs=5
autorestart=true
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
redirect_stderr=true

[program:consolidation]
command=/usr/bin/python3 /home/server/defense_system/modules/consolidation.py
priority=20
autorestart=true
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
redirect_stderr=true

[program:suricata_reader]
command=/usr/bin/python3 /home/server/defense_system/modules/suricata_reader.py
priority=30
autorestart=true
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
redirect_stderr=true

[program:surveillance]
command=/usr/bin/python3 /home/server/defense_system/modules/surveillance.py
environment=DEFENSE_IFACE="%(ENV_DEFENSE_IFACE)s"
priority=40
autorestart=true
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
redirect_stderr=true

[program:honeyd_services]
command=/usr/bin/python3 /home/server/defense_system/modules/honeyd_services.py
priority=50
autorestart=true
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
redirect_stderr=true

[program:ipset_save]
; ipset-save.timer : sauvegarde des attaquants toutes les 5 minutes
command=/bin/bash -c 'while sleep 300; do ipset save > /lab-state/ipset.rules; done'
priority=60
autorestart=true
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
redirect_stderr=true
